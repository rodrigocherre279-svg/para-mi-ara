<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date?</title>

    
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Bellota+Text:ital,wght@1,300&family=Poppins:wght@400;700&family=Roboto:wght@400;700&display=swap');

        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Bellota Text', sans-serif;
    
}
body, html{
    width: 100%;
    height: 100vh;
    background-image: url("./img/fondo-bosque.avif");

    background-size:cover;
}

.confirmation{
    display: none;
    width: 400px;
    height: 500px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    text-align: center;
    /* padding-top: 50px; */
}

.confirmation h1{
    font-style: bolder;
    font-size: 50px;
    font-weight: 700;
    text-shadow: 0px 3px 6px rgb(147, 77, 77);
    line-height: 90px;
}

.fix-gif{

    display: flex;
    justify-content: center;
    align-items: center;
    width:100%;
    height: 400px;
    

}

.fix-gifimg{
    border-radius: 10px;
    width: 384px;
    height: 360px;
    background-image: url("./img/congrats.png");
    background-size: cover; 
}

.container h1{
    margin-bottom: 20px;
    margin-top: 50px;
    font-style: bolder;
    font-size: 50px;
    font-weight: 700;
    text-shadow: 0px 3px 6px rgb(147, 77, 77);
}

#fix{
    margin-top: 30px;
        border: none;
        width: 400px;
        height: 50px;
        font-size: 30px;
        border-radius: 10px;
        background: none;
        backdrop-filter: blur(5px);
        border: 1px solid black;
        background-color:white;
        font-weight: 550;
}
.container{
    width: 400px;
    height: 500px;
    position: absolute;
    left: 50%;
    top: 40%;
    transform: translate(-50%,-50%);
    text-align: center;
    
}

.gif{

    display: flex;
    justify-content: center;
    align-items: center;
    width:100%;
    height: 500px;
    

}

.gifimg{
    border-radius: 10px;
    width: 384px;
    height: 454px;
    background-image: url("./img/lobo1.jpg");
    background-size: cover; 
}

.answer-box{
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    /* background-color: black; */
    padding: 10px;
    margin-top: 5px;
    width: 100%;
    height: 80px;
    gap: 50px;
}

.answer{
    border: none;
    width: 100px;
    height: 50px;
    font-weight: 600 !important;
    font-size: 30px;
    border-radius: 10px;
    background: none;
    backdrop-filter: blur(5px);
    border: 1px solid black;
    font-weight: 550;
    background-color:white;    
}
.answer:hover{
    box-shadow: inset 0px 3px 6px rgba(0, 0, 0, 0.449);
}

@media screen and (max-width: 600px){
    html,
    body{
        min-height: 100%;
        height: auto;
        overflow-x: hidden;
    }

    body{
        min-height: 100svh;
        background-position: center;
    }

    .container{
        width: min(100%, 380px);
        min-height: 100svh;
        height: auto;
        top: 0;
        padding: 24px 16px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .container h1{
        margin-top: 20px;
        padding: 8px;
        font-size: 35px;
    }
    .answer{
        font-size: 20px;
        padding: 5px;
        width: min(100px, 42vw);
        height: 48px;
    }

    .gif{
        height: auto;
        width: 100%;
    }

    .gifimg{
        border-radius: 10px;
        width: min(100%, 300px);
        aspect-ratio: 384 / 454;
        height: auto;
        background-size: cover; 
    }

    .fix-gif{
        height: auto;
        min-height: 0;
    }
    
    .fix-gifimg{
        border-radius: 10px;
        width: min(100%, 300px);
        aspect-ratio: 384 / 360;
        height: auto;
        background-size: cover; 
    }

    #fix{
        margin: 24px auto 0;
        width: min(100%, 340px);
        min-height: 50px;
        height: auto;
        padding: 10px 14px;
        font-size: clamp(18px, 5vw, 26px);
        line-height: 1.2;
    }

    .confirmation{
        width: min(100%, 380px);
        height: auto;
        min-height: 100svh;
        padding: 24px 16px;
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        text-align: center;
    }
}

    
    </style>
    </style>
</head>
<body>
    <div class="container">
        <div class="gif">
            <div class="gifimg"></div>
        </div>
        <div class="answer-box">
                <button class="answer" id="yes">Yes!!!</button>
                <button class="answer" id="no">No</button>
        </div>
        
    </div>

    <div class="confirmation">
            <div class="question">
                <div class="fix-gif">
                    <div class="fix-gifimg"></div>
                </div>
                <!-- <a href="https://wa.me/+918595790116?text='Chalo date pr chalein!!!!!' ">
                </a> -->
                    <button class="answer" id="fix">Buena elección,dime que me quieres uwu!!!!</button>
                
            </div>
    </div>

    </div>

    <script>
        const yes = document.querySelector("#yes");
const no = document.querySelector("#no");
const confirmation = document.querySelector(".confirmation");
const container = document.querySelector(".container");

const yesAnswerMethod = () => {
    container.style.display = 'none'
    confirmation.style.display = 'block'
}

const noAnswerMethod = () => {
    no.style.position = 'absolute'

    const maxX = Math.max(0, container.clientWidth - no.offsetWidth)
    const maxY = Math.max(0, container.clientHeight - no.offsetHeight)
    const xPosition = Math.floor(Math.random() * maxX)
    const yPosition = Math.floor(Math.random() * maxY)

    no.style.top = `${yPosition}px`
    no.style.left = `${xPosition}px`

}

no.addEventListener('click', noAnswerMethod)
yes.addEventListener('click', yesAnswerMethod)

document.getElementById("fix").addEventListener("click", function(){
    window.location= "https://wa.me/+970117635?text='Te quiero mucho mi lobitooooo <3'";
}, false);
    </script>
    
</body>
</html>
